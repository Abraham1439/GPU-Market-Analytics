name: CI

# Se ejecuta en cada push o pull request a main/develop, validando
# que el proyecto instale, pase los tests y construya correctamente
# en Docker antes de integrar cambios (indicador de la pauta EFT:
# "Containerización y CI/CD: Dockerfiles, docker-compose, scripts y
# workflows de integración continua").

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pipeline ETL
        run: python -m etl.pipeline

      - name: Entrenar modelos ML
        run: |
          python -m models.train_regression
          python -m models.train_classification
          python -m models.train_clustering

      - name: Correr tests
        run: pytest -v

      - name: Subir artefactos de modelos entrenados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: models/artifacts/
          retention-days: 7

  docker-build:
    name: Build de Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: docker compose config

      - name: Construir imagen Docker
        run: docker build -t gpu-market-analytics:ci .
